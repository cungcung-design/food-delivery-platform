services:

  postgres:
    image: postgres:16-alpine
    container_name: food-delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: food_delivery
      POSTGRES_PASSWORD: food_delivery
      POSTGRES_DB: food_delivery
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: food-delivery-redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: food-delivery-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://food_delivery:food_delivery@postgres:5432/food_delivery?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-this-to-a-long-random-secret
      JWT_EXPIRES_HOURS: "24"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: food-delivery-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: